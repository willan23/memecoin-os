services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memecoin
      POSTGRES_PASSWORD: memecoin
      POSTGRES_DB: memecoin_os
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memecoin -d memecoin_os"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
